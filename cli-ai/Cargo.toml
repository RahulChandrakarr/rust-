[package]
name = "cli-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }       # async runtime
reqwest = { version = "0.11", features = ["json", "gzip", "stream"] } # HTTP client
serde = { version = "1.0", features = ["derive"] }   # (de)serialize JSON
serde_json = "1.0"
async-trait = "0.1"
anyhow = "1.0"
dotenvy = "0.15"
colored = "2"